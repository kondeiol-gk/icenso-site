name: Import ICENSO production site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import current production and apply V1.11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "https://icenso-site.vercel.app"

          pages = {
              "/": "index.html",
              "/collection": "collection.html",
              "/about": "about.html",
              "/partners": "partners.html",
              "/contact": "contact.html",
              "/admin": "admin.html",
              "/brand": "brand.html",
              "/lookbook": "lookbook.html",
              "/stores": "stores.html",
          }

          def fetch(path):
              req = Request(BASE + path, headers={"User-Agent": "ICENSO-GitHub-Bootstrap/1.0"})
              with urlopen(req, timeout=60) as r:
                  return r.status, r.read()

          for route, dest in pages.items():
              try:
                  status, data = fetch(route)
              except (HTTPError, URLError) as e:
                  if route in {"/admin", "/brand", "/lookbook", "/stores"}:
                      print(f"Skipping optional page {route}: {e}")
                      continue
                  raise
              if status != 200:
                  if route in {"/admin", "/brand", "/lookbook", "/stores"}:
                      print(f"Skipping optional page {route}: HTTP {status}")
                      continue
                  raise RuntimeError(f"{route}: HTTP {status}")
              p = Path(dest)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print("Fetched", route, "->", dest)

          static_files = {
              "/assets/css/site-v1.9.css": "assets/css/site-v1.9.css",
              "/assets/js/site-v1.9.js": "assets/js/site-v1.9.js",
              "/assets/images/icenso-logo-final-transparent-v2.png": "assets/images/icenso-logo-final-transparent-v2.png",
          }
          for i in range(1, 38):
              static_files[f"/assets/images/fw26-final-{i:02d}.jpeg"] = f"assets/images/fw26-final-{i:02d}.jpeg"

          for route, dest in static_files.items():
              status, data = fetch(route)
              if status != 200:
                  raise RuntimeError(f"{route}: HTTP {status}")
              p = Path(dest)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print("Fetched", route, "->", dest, len(data), "bytes")

          # V1.11: remove the secondary sentence and final period from the first strip.
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          before = '<div class="strip-copy">Looks para todos<br/>os momentos.<span>Estilo que inspira mudança.</span></div>'
          after = '<div class="strip-copy">Looks para todos<br/>os momentos</div>'
          if before not in html:
              raise RuntimeError("Expected homepage V1.10 strip text was not found; refusing an unsafe replacement.")
          html = html.replace(before, after, 1)
          p.write_text(html, encoding="utf-8")

          Path("vercel.json").write_text("""{
            "cleanUrls": true,
            "trailingSlash": false
          }
          """, encoding="utf-8")

          Path(".gitignore").write_text(".DS_Store\n*.zip\n", encoding="utf-8")

          Path("README.md").write_text("""# ICENSO JEANS

Site oficial ICENSO JEANS.

- Fonte de produção versionada em Git
- Branch de produção: `main`
- Deploy: Vercel
- Versão: V1.11

## V1.11
Na página inicial foi retirada a frase “Estilo que inspira mudança.” e “Looks para todos os momentos” ficou sem ponto final.
""", encoding="utf-8")
          PY

      - name: Commit imported site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import ICENSO production and apply V1.11"
          git push
